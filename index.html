<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drum Kit</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="images/drum-icon.svg" type="image/png">
</head>
<body>

    <div>
        <h1>Press a key to play a sound</h1>
        <p>Click on the keys or press the corresponding keyboard keys (A, S, D, F, G, H, J, K, L) to play sounds.</p>
    </div>


    <div class="keys">
        <div data-key="67" class="key">
            <kbd>C</kbd>
            <span class="sound">Clap</span>
        </div>
        <div data-key="72" class="key">
            <kbd>H</kbd>
            <span class="sound">Hi-Hat</span>
        </div>
        <div data-key="75" class="key">
            <kbd>K</kbd>
            <span class="sound">Kick</span>
        </div>
        <div data-key="79" class="key">
            <kbd>O</kbd>
            <span class="sound">OpenHat</span>
        </div>
        <div data-key="66" class="key">
            <kbd>B</kbd>
            <span class="sound">Blast Block</span>
        </div>
        <div data-key="82" class="key">
            <kbd>R</kbd>
            <span class="sound">Ride</span>
        </div>
        <div data-key="83" class="key">
            <kbd>S</kbd>
            <span class="sound">Snare</span>
        </div>
        <div data-key="84" class="key">
            <kbd>T</kbd>
            <span class="sound">Tom</span>
        </div>
        <div data-key="69" class="key">
            <kbd>E</kbd>
            <span class="sound">Egg Shaker</span>
        </div>
    </div>

    <div>
        <p class="credit">Made by <a href="https://www.linkedin.com/in/naflan-mohamed" target="_blank">Naflan Mohamed</a></p>
    </div>


<audio data-key="67" src="sounds/clap.wav"></audio>
<audio data-key="72" src="sounds/hihat.wav"></audio>
<audio data-key="75" src="sounds/kick.wav"></audio>
<audio data-key="79" src="sounds/openhat.wav"></audio>
<audio data-key="66" src="sounds/blastblock.wav"></audio>
<audio data-key="82" src="sounds/ride.wav"></audio>
<audio data-key="83" src="sounds/snare.wav"></audio>
<audio data-key="84" src="sounds/tom.wav"></audio>
<audio data-key="69" src="sounds/eggshaker.wav"></audio>

<script src="script.js"></script>


</body>
</html>
